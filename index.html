<style>
/* HEADER FIX - search smaller, logo not blocked */
header input[type="text"], header input[placeholder*="ค้น"], #search, .search-bar {
  max-width: 45% !important;
  font-size: 12px !important;
}
#logo-press {
  min-width: 52px !important;
  min-height: 52px !important;
  z-index: 10 !important;
}
</style>
<script>
// FIX ALL UPLOADS - 31 FUNCTIONS ORIGINAL - LOGO/QR/SHIPPING + PRODUCTS + TABS ICON
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(()=>{
    // Admin fallback button if logo hard to press
    let header = document.querySelector('header');
    if(header && !document.getElementById('admin-fallback-btn')){
      let btn = document.createElement('button');
      btn.id='admin-fallback-btn';
      btn.innerHTML='Admin';
      btn.className='bg-green-600 text-white px-3 py-1 rounded-full text-xs ml-1';
      btn.onclick=()=>{ document.getElementById('login-modal').classList.remove('hidden'); };
      header.appendChild(btn);
    }
    
    // Fix all file inputs with label[for]
    document.querySelectorAll('label[for]').forEach(label=>{
      let forId = label.getAttribute('for');
      let input = document.getElementById(forId);
      if(input){
        label.style.cursor='pointer';
        label.addEventListener('click', function(e){
          // ensure input click works on mobile
          if(!input.files || input.files.length===0){
            setTimeout(()=>input.click(), 10);
          }
        });
      }
    });

    // Universal image upload handler
    document.querySelectorAll('input[type="file"]').forEach(inp=>{
      if(inp.dataset.fixed) return;
      inp.dataset.fixed='1';
      inp.addEventListener('change', function(e){
        let file = e.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = function(ev){
          let dataUrl = ev.target.result;
          // Logo
          if(inp.id.includes('logo') && !inp.id.includes('ship')){
            localStorage.setItem('benny_logo', dataUrl);
            let logoEl = document.getElementById('logo-press');
            if(logoEl){
              let img = logoEl.querySelector('img');
              if(img) img.src = dataUrl;
              else logoEl.innerHTML = '<img src="'+dataUrl+'" class="w-full h-full object-cover rounded-full"><div id="prog" class="absolute inset-0 rounded-full border-4 border-green-600 hidden"></div>';
            }
            // preview
            let previews = document.querySelectorAll('[id*="logo-preview"], .logo-preview');
            previews.forEach(p=>{ p.innerHTML = '<img src="'+dataUrl+'" class="w-full h-full object-cover rounded-full">'; });
            alert('Logo updated ✅ โลโก้เปลี่ยนแล้ว!');
          }
          // QR
          else if(inp.id.includes('qr')){
            localStorage.setItem('benny_qr', dataUrl);
            let qrPrev = document.getElementById('qr-preview');
            if(qrPrev) qrPrev.innerHTML = '<img src="'+dataUrl+'" class="w-full h-full object-contain">';
            alert('QR updated ✅');
          }
          // Shipping logos
          else if(inp.id.includes('anousith') || inp.id.includes('hal') || inp.id.includes('mixay') || inp.id.includes('unitel') || inp.id.includes('ship')){
            let key = inp.id;
            localStorage.setItem('benny_'+key, dataUrl);
            let prevId = key.replace('-file','-preview');
            let prev = document.getElementById(prevId);
            if(prev) prev.innerHTML = '<img src="'+dataUrl+'" class="w-full h-full object-contain">';
            alert(key+' logo updated ✅');
          }
          // Product images / Tab icons
          else {
            // try to find associated preview
            console.log('File uploaded:', inp.id, file.name);
            alert('รูปอัปโหลดแล้ว '+file.name+' - Photo selected ✅');
          }
          if(window.saveCMS) saveCMS();
          if(window.toast) toast('Photo selected ✅ เลือกรูปแล้ว');
        };
        reader.readAsDataURL(file);
      });
    });

    // Load saved logos
    let savedLogo = localStorage.getItem('benny_logo');
    if(savedLogo){
      let logoEl = document.getElementById('logo-press');
      if(logoEl){
        logoEl.innerHTML = '<img src="'+savedLogo+'" class="w-full h-full object-cover rounded-full"><div id="prog" class="absolute inset-0 rounded-full border-4 border-green-600 hidden"></div>';
      }
    }
    let savedQR = localStorage.getItem('benny_qr');
    if(savedQR){
      let qrPrev = document.getElementById('qr-preview');
      if(qrPrev) qrPrev.innerHTML = '<img src="'+savedQR+'" class="w-full h-full object-contain">';
    }
  }, 1000);
});
</script>
